name: Refresh live market snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - "MARKET_REFRESH_TRIGGER.txt"

permissions:
  contents: write

concurrency:
  group: live-market-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch read-only Saxo market snapshot
        env:
          BRIDGE_API_KEY: ${{ secrets.BRIDGE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$BRIDGE_API_KEY"
          mkdir -p data
          http_code=$(curl --silent --show-error -w "%{http_code}" \
            -H "x-api-key: $BRIDGE_API_KEY" \
            "https://saxo-market-data-dashboard.vercel.app/api/bridge/snapshot" \
            -o data/live-market-snapshot.json)
          if [ "$http_code" != "200" ]; then
            echo "Bridge returned HTTP $http_code"
            python -m json.tool data/live-market-snapshot.json || cat data/live-market-snapshot.json
            exit 1
          fi
          python -m json.tool data/live-market-snapshot.json >/dev/null

      - name: Commit snapshot when changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-market-snapshot.json
          if git diff --cached --quiet; then
            echo "No market-data change."
            exit 0
          fi
          git commit -m "Refresh live Saxo market snapshot"
          git push
